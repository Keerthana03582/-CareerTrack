
<!DOCTYPE html>
<html>
<head>
    <title>Update Application - CareerTrack</title>
</head>

<body>

    <h1>CareerTrack</h1>
    <h2>Update Job Application</h2>

    <p>Job Title: {{ application[1] }}</p>

    <p>Current Status: {{ application[2] }}</p>

    <form method="POST">

        <label>Application Status:</label>

        <select name="status" required>

            <option value="Applied"
            {% if application[2] == "Applied" %}selected{% endif %}>
                Applied
            </option>

            <option value="Interview"
            {% if application[2] == "Interview" %}selected{% endif %}>
                Interview
            </option>

            <option value="Selected"
            {% if application[2] == "Selected" %}selected{% endif %}>
                Selected
            </option>

            <option value="Rejected"
            {% if application[2] == "Rejected" %}selected{% endif %}>
                Rejected
            </option>

        </select>

        <br><br>

        <button type="submit">Update Status</button>

    </form>

    <br>

    <a href="/applications">Back to Applications</a>

</body>
</html>
